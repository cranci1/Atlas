name: Build and Release
on:
  push:
    branches:
      - main
jobs:
  build-ios:
    name: Build IPA
    runs-on: macOS-26
    steps:
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run ipabuild.sh
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-IPA
          path: build/Atlas.ipa
          compression-level: 0
